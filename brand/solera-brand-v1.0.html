document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"1719e029-f955-4b8d-9eb7-b51fa7dc1f89\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"anonymous\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Karla';\n  font-style: italic;\n  font-weight: 300 500;\n  font-display: swap;\n  src: url(\"ba2a3eec-e6a5-4713-aea7-df85e31914c8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Karla';\n  font-style: italic;\n  font-weight: 300 500;\n  font-display: swap;\n  src: url(\"0c1cfe7d-1237-4334-a2bd-a99902ad145a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Karla';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(\"ef3b02af-fccd-4d7c-81a3-4cd24774b358\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Karla';\n  font-style: normal;\n  font-weight: 300 700;\n  font-display: swap;\n  src: url(\"5a389ae8-59ea-4689-9db0-b1d731b90262\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Petrona';\n  font-style: italic;\n  font-weight: 300 500;\n  font-display: swap;\n  src: url(\"6cdc52d1-0e92-421b-8274-b0fcafab15e4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Petrona';\n  font-style: italic;\n  font-weight: 300 500;\n  font-display: swap;\n  src: url(\"99766441-b790-428b-982c-d67060c2828c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Petrona';\n  font-style: italic;\n  font-weight: 300 500;\n  font-display: swap;\n  src: url(\"62e00c21-efb9-4c69-9022-82768ac7da17\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Petrona';\n  font-style: normal;\n  font-weight: 300 600;\n  font-display: swap;\n  src: url(\"6938f75b-640e-4702-a37d-07edb93563c7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Petrona';\n  font-style: normal;\n  font-weight: 300 600;\n  font-display: swap;\n  src: url(\"e9fb8a8d-3892-423b-b17a-ba3779740c82\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Petrona';\n  font-style: normal;\n  font-weight: 300 600;\n  font-display: swap;\n  src: url(\"87335c15-3413-4928-b6cf-edb71d366d9e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --paper: oklch(0.966 0.014 78);\n    --surface: oklch(0.928 0.026 70);\n    --ink: oklch(0.26 0.021 45);\n    --muted: oklch(0.510 0.022 58);\n    --rule: oklch(0.872 0.020 72);\n    --accent: #B3623C;\n    --accent-ink: #98502C;\n    --accent2-ink: #5E6B34;\n    --accent2: #6B7A3C;\n    --mk-r: 50% 50% 2px 2px;\n  }\n  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}\n  *{box-sizing:border-box;}\n  h1,h2,h3,h4,p,ul,li{margin:0;padding:0;}\n  ul{list-style:none;}\n  a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid currentColor;}\n  a:hover{color:var(--ink);}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:var(--paper);color:var(--ink);font-family:Karla,Helvetica,Arial,sans-serif;padding:clamp(24px,5vw,80px);display:flex;flex-direction:column;gap:clamp(68px,9vw,120px);max-width:1180px;margin:0 auto;\">\n\n  <header style=\"display:flex;flex-direction:column;gap:clamp(26px,4vw,44px);\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);\">\n      <span>Brand identity — v1.0<\u002Fspan>\n      <span>September 2026<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:flex-end;gap:clamp(16px,3vw,30px);flex-wrap:wrap;\">\n      <div style=\"width:clamp(46px,6vw,74px);height:clamp(56px,7.5vw,92px);border:1.5px solid var(--ink);border-radius:var(--mk-r);position:relative;flex:0 0 auto;\">\n        <span style=\"display:block;position:absolute;left:50%;transform:translateX(-50%);bottom:14%;width:2px;height:34%;background:var(--accent);\"><\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family:Petrona,Georgia,serif;font-weight:400;font-size:clamp(62px,13.5vw,168px);line-height:0.84;letter-spacing:-0.035em;\">Solera<\u002Fh1>\n    <\u002Fdiv>\n    <p style=\"font-family:Petrona,Georgia,serif;font-size:clamp(22px,3.2vw,38px);line-height:1.22;max-width:26ch;\">Your house in Spain, looked after all year — in Dutch.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:clamp(20px,3vw,40px);border-top:1px solid var(--rule);padding-top:20px;\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);\">Category<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;\">Year-round ownership service, Spain<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);\">Audience<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;\">Dutch owners of a Spanish house<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);\">Register<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.5;\">Dutch, plain-spoken, unmistakably local<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:clamp(26px,4vw,42px);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">\n      <span style=\"color:var(--muted);\">01<\u002Fspan>\n      <h2 style=\"font-weight:700;font-size:11px;letter-spacing:0.18em;\">The name<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(28px,4vw,56px);align-items:start;\">\n      <p style=\"font-family:Petrona,Georgia,serif;font-size:clamp(23px,3.2vw,36px);line-height:1.26;\">A <em style=\"font-style:italic;\">solera<\u002Fem> is the sunny south face of a house — and the patient method of ageing sherry, where each year is folded into the last.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <p style=\"font-size:17px;line-height:1.6;color:var(--ink);\">Both meanings are the promise: light, warmth, and something that improves by being cared for over time. It is a real Spanish word, pronounceable in English, German and Dutch, and free of the sun-lounger clichés the category is drowning in.<\u002Fp>\n        <p style=\"font-size:17px;line-height:1.6;color:var(--muted);\">For an annual service the metaphor does real work: the value is in the years, not the transaction. Pronounced so-LEH-ra. Always set in Petrona, capital S, never translated.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:clamp(26px,4vw,42px);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">\n      <span style=\"color:var(--muted);\">02<\u002Fspan>\n      <h2 style=\"font-weight:700;font-size:11px;letter-spacing:0.18em;\">Positioning<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-family:Petrona,Georgia,serif;font-size:clamp(24px,3.4vw,42px);line-height:1.22;max-width:32ch;margin-bottom:clamp(30px,4vw,50px);\">Four obligations, one annual fee, one number to call — in Dutch.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:clamp(22px,3vw,44px);\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ink);padding-top:14px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-ink);\">What it is<\u002Fspan>\n        <p style=\"font-size:17px;line-height:1.55;\">One fee covers the four things Spain requires of a non-resident owner: the tax return, the insurance, the community and utilities admin, and the rental licence.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ink);padding-top:14px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-ink);\">Who it's for<\u002Fspan>\n        <p style=\"font-size:17px;line-height:1.55;\">Dutch owners of a Spanish house — here six to twelve weeks a year, tired of forwarding Spanish letters to four providers who don’t speak Dutch.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule);padding-top:14px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);\">What it isn't<\u002Fspan>\n        <p style=\"font-size:17px;line-height:1.55;color:var(--muted);\">A gestor with a website, or English wallpaper over Spanish legalese. No listings, no sales commission, no five separate invoices.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:clamp(26px,4vw,42px);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">\n      <span style=\"color:var(--muted);\">03<\u002Fspan>\n      <h2 style=\"font-weight:700;font-size:11px;letter-spacing:0.18em;\">The offer — Solera Anual<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(24px,4vw,52px);align-items:start;margin-bottom:clamp(28px,4vw,44px);\">\n      <p style=\"font-family:Petrona,Georgia,serif;font-size:clamp(23px,3.2vw,36px);line-height:1.24;\">Every Dutch owner hits the same four obligations — and solves each one separately, with a provider who doesn’t speak Dutch.<\u002Fp>\n      <p style=\"font-size:17px;line-height:1.62;color:var(--muted);\">Bundled, it stops being four chores and becomes one relationship that compounds year on year — the argument the name already makes. Sold as a single annual subscription: one contact, one dossier, one invoice. <em style=\"font-style:italic;color:var(--ink);\">Solera Anual<\u002Fem>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);\">\n        <div style=\"background:var(--paper);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:14px;\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-ink);\">01<\u002Fspan>\n          <h3 style=\"font-family:Petrona,Georgia,serif;font-weight:400;font-size:clamp(26px,3vw,34px);line-height:1.14;letter-spacing:-0.02em;\">Modelo 210<\u002Fh3>\n          <p style=\"font-family:Petrona,Georgia,serif;font-style:italic;font-size:19px;line-height:1.32;\">“De belasting die niemand u heeft uitgelegd.”<\u002Fp>\n          <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\">Non-resident imputed-income tax falls due even in a year the house was never let. We file it, keep IBI on schedule, and flag wealth-tax exposure before a valuation crosses the threshold.<\u002Fp>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;margin-top:auto;\">Filed annually · quarterly if let · deadline watch<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:14px;\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-ink);\">02<\u002Fspan>\n          <h3 style=\"font-family:Petrona,Georgia,serif;font-weight:400;font-size:clamp(26px,3vw,34px);line-height:1.14;letter-spacing:-0.02em;\">Hogar &amp; verhuur<\u002Fh3>\n          <p style=\"font-family:Petrona,Georgia,serif;font-style:italic;font-size:19px;line-height:1.32;\">“Uw polis, uitgelegd in het Nederlands.”<\u002Fp>\n          <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\">Home cover placed through our own correduría, with the liability extension short-term letting actually requires — and a policy document you can read without a translator.<\u002Fp>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;margin-top:auto;\">Placed · reviewed each renewal · claims handled here<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--surface);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:14px;\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-ink);\">03<\u002Fspan>\n          <h3 style=\"font-family:Petrona,Georgia,serif;font-weight:400;font-size:clamp(26px,3vw,34px);line-height:1.14;letter-spacing:-0.02em;\">Comunidad &amp; trámites<\u002Fh3>\n          <p style=\"font-family:Petrona,Georgia,serif;font-style:italic;font-size:19px;line-height:1.32;\">“Post uit Spanje? Stuur het door en vergeet het.”<\u002Fp>\n          <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\">NIE, padrón, utilities in your own name, meter changes — and someone actually reading the comunidad minutes, so a €4,000 façade levy is not a surprise in July.<\u002Fp>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;margin-top:auto;\">Retainer · we hold the postal address<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--paper);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:14px;\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-ink);\">04<\u002Fspan>\n          <h3 style=\"font-family:Petrona,Georgia,serif;font-weight:400;font-size:clamp(26px,3vw,34px);line-height:1.14;letter-spacing:-0.02em;\">Licencia turística<\u002Fh3>\n          <p style=\"font-family:Petrona,Georgia,serif;font-style:italic;font-size:19px;line-height:1.32;\">“Verhuurt u legaal? Wij weten het zeker.”<\u002Fp>\n          <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\">Regional licensing is tightening fastest in Valencia and Alicante. We check your registration, apply where it is still possible, and say plainly when it is not.<\u002Fp>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;margin-top:auto;\">Annual compliance check · region-specific<\u002Fspan>\n        <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:16px;line-height:1.6;color:var(--muted);margin-top:clamp(18px,3vw,26px);max-width:74ch;\">Every module page states the annual fee on the first screen, in euros, as a yearly total — never a monthly-looking number. That is <em style=\"font-style:italic;color:var(--ink);\">name the cost<\u002Fem> (§07) applied literally, and it is the whole competitive difference.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:clamp(26px,4vw,42px);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">\n      <span style=\"color:var(--muted);\">04<\u002Fspan>\n      <h2 style=\"font-weight:700;font-size:11px;letter-spacing:0.18em;\">Mark &amp; lockup<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:17px;line-height:1.6;max-width:56ch;color:var(--muted);margin-bottom:clamp(22px,3vw,34px);\">The mark is a doorway: a plastered arch with a single warm line where the light falls. Simple enough to punch into 16px, warm enough to feel like a place rather than a platform.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);\">\n      <div style=\"background:var(--paper);padding:clamp(26px,4vw,40px);display:flex;flex-direction:column;gap:26px;min-height:210px;justify-content:space-between;\">\n        <div style=\"display:flex;align-items:center;gap:14px;\">\n          <div style=\"width:30px;height:38px;border:1.5px solid var(--ink);border-radius:var(--mk-r);position:relative;flex:0 0 auto;\">\n            <span style=\"display:block;position:absolute;left:50%;transform:translateX(-50%);bottom:14%;width:1.5px;height:34%;background:var(--accent);\"><\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-family:Petrona,Georgia,serif;font-size:38px;line-height:1;letter-spacing:-0.025em;\">Solera<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);\">Primary lockup<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);padding:clamp(26px,4vw,40px);display:flex;flex-direction:column;gap:26px;min-height:210px;justify-content:space-between;\">\n        <div style=\"width:48px;height:60px;border:1.5px solid var(--ink);border-radius:var(--mk-r);position:relative;\">\n          <span style=\"display:block;position:absolute;left:50%;transform:translateX(-50%);bottom:14%;width:2px;height:34%;background:var(--accent);\"><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);\">Mark alone — favicon, app, stamp<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:var(--ink);padding:clamp(26px,4vw,40px);display:flex;flex-direction:column;gap:26px;min-height:210px;justify-content:space-between;\">\n        <div style=\"display:flex;align-items:center;gap:14px;\">\n          <div style=\"width:30px;height:38px;border:1.5px solid var(--paper);border-radius:var(--mk-r);position:relative;flex:0 0 auto;\">\n            <span style=\"display:block;position:absolute;left:50%;transform:translateX(-50%);bottom:14%;width:1.5px;height:34%;background:var(--paper);\"><\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-family:Petrona,Georgia,serif;font-size:38px;line-height:1;letter-spacing:-0.025em;color:var(--paper);\">Solera<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--rule);\">Reversed — single colour only<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:clamp(20px,3vw,40px);margin-top:clamp(22px,3vw,34px);\">\n      <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\"><strong style=\"color:var(--ink);font-weight:700;\">Clearspace.<\u002Fstrong> Leave the width of the arch clear on all four sides. Minimum mark height 18px; minimum lockup width 104px.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\"><strong style=\"color:var(--ink);font-weight:700;\">Never.<\u002Fstrong> Don't fill the arch with a photograph, add a roof or a sun, tilt it, outline the wordmark, or set the lockup in any face but Petrona.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:clamp(26px,4vw,42px);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">\n      <span style=\"color:var(--muted);\">05<\u002Fspan>\n      <h2 style=\"font-weight:700;font-size:11px;letter-spacing:0.18em;\">Colour<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:clamp(14px,2vw,22px);\">\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"aspect-ratio:4/5;background:var(--paper);border:1px solid var(--rule);\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:3px;\">\n          <span style=\"font-size:16px;font-weight:600;\">Lime plaster<\u002Fspan>\n          <span style=\"font-size:11px;line-height:1.5;color:var(--muted);\">Page ground — 62%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"aspect-ratio:4/5;background:var(--surface);border:1px solid var(--rule);\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:3px;\">\n          <span style=\"font-size:16px;font-weight:600;\">Clay<\u002Fspan>\n          <span style=\"font-size:11px;line-height:1.5;color:var(--muted);\">Cards, quiet blocks — 14%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"aspect-ratio:4/5;background:var(--ink);\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:3px;\">\n          <span style=\"font-size:16px;font-weight:600;\">Olive ink<\u002Fspan>\n          <span style=\"font-size:11px;line-height:1.5;color:var(--muted);\">Type, rules, buttons — 16%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"aspect-ratio:4/5;background:var(--accent);\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:3px;\">\n          <span style=\"font-size:16px;font-weight:600;\">Terracotta<\u002Fspan>\n          <span style=\"font-size:11px;line-height:1.5;color:var(--muted);\">Fills &amp; the arch light — 5%. As type, use #98502C<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"aspect-ratio:4/5;background:var(--accent2);\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:3px;\">\n          <span style=\"font-size:16px;font-weight:600;\">Grove<\u002Fspan>\n          <span style=\"font-size:11px;line-height:1.5;color:var(--muted);\">Confirmed, complete — 3%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;margin-top:clamp(26px,4vw,42px);height:42px;border:1px solid var(--rule);\">\n      <div style=\"flex:62;background:var(--paper);\"><\u002Fdiv>\n      <div style=\"flex:14;background:var(--surface);\"><\u002Fdiv>\n      <div style=\"flex:16;background:var(--ink);\"><\u002Fdiv>\n      <div style=\"flex:5;background:var(--accent);\"><\u002Fdiv>\n      <div style=\"flex:3;background:var(--accent2);\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5;\">Intended balance across a page. Terracotta is punctuation, never a surface — no gradients, no tinted photographs, no third accent.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:clamp(26px,4vw,42px);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">\n      <span style=\"color:var(--muted);\">06<\u002Fspan>\n      <h2 style=\"font-weight:700;font-size:11px;letter-spacing:0.18em;\">Typography<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:clamp(30px,4vw,50px);\">\n      <div style=\"background:var(--paper);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:18px;\">\n        <span style=\"font-family:Petrona,Georgia,serif;font-size:54px;line-height:1;\">Aa Gg<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:4px;\">\n          <span style=\"font-size:16px;font-weight:600;\">Petrona<\u002Fspan>\n          <span style=\"font-size:12px;line-height:1.5;color:var(--muted);\">Headlines, the name, pull quotes — 400/500, italic for emphasis<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:18px;\">\n        <span style=\"font-family:Karla,Helvetica,sans-serif;font-size:54px;line-height:1;\">Aa Gg<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:4px;\">\n          <span style=\"font-size:16px;font-weight:600;\">Karla<\u002Fspan>\n          <span style=\"font-size:12px;line-height:1.5;color:var(--muted);\">Body, interface, labels — 400/600/700, uppercase for eyebrows<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:clamp(30px,4vw,54px);\">\n      <ul style=\"display:flex;flex-direction:column;gap:20px;\">\n        <li style=\"display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px;\">\n          <span style=\"font-family:Petrona,Georgia,serif;font-size:44px;line-height:1;letter-spacing:-0.035em;\">Display<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--muted);\">Petrona 400 · 84/72 · -3.5%<\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px;\">\n          <span style=\"font-family:Petrona,Georgia,serif;font-size:30px;line-height:1.2;\">Section title<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--muted);\">Petrona 400 · 34/42 · -2%<\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px;\">\n          <span style=\"font-size:18px;line-height:1.6;\">Body — the reading size<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--muted);\">Karla 400 · 18/29 · 68ch max<\u002Fspan>\n        <\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px;\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">Eyebrow / label<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:0.06em;color:var(--muted);\">Karla 700 · 11/16 · +18%<\u002Fspan>\n        <\u002Fli>\n      <\u002Ful>\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <p style=\"font-family:Petrona,Georgia,serif;font-size:30px;line-height:1.24;\">Owning here is not difficult, only unfamiliar<\u002Fp>\n        <p style=\"font-size:18px;line-height:1.62;max-width:64ch;\">There are four things Spain asks of you every year, two of them with deadlines nobody mentions until they have passed. We list all four on one page, in Dutch, with what each one costs. Then we do them, and send you a single dossier in January.<\u002Fp>\n        <p style=\"font-size:12px;color:var(--muted);\">Body specimen · Karla 400 · 18/29 · set flush left, soft rag, never justified<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;\">\n    <div style=\"display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:clamp(26px,4vw,42px);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">\n      <span style=\"color:var(--muted);\">07<\u002Fspan>\n      <h2 style=\"font-weight:700;font-size:11px;letter-spacing:0.18em;\">Voice<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:clamp(22px,3vw,44px);margin-bottom:clamp(30px,4vw,50px);\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <span style=\"font-family:Petrona,Georgia,serif;font-size:26px;line-height:1.22;\">Name the cost<\u002Fspan>\n        <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\">Every number, every fee, every tax, stated before anyone asks. Trust across a border is built in euros.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <span style=\"font-family:Petrona,Georgia,serif;font-size:26px;line-height:1.22;\">Local, not exotic<\u002Fspan>\n        <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\">Spain is where people live, not a postcard. Spanish words for Spanish things — <em style=\"font-style:italic;\">escritura<\u002Fem>, <em style=\"font-style:italic;\">gestor<\u002Fem> — always with a plain gloss.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <span style=\"font-family:Petrona,Georgia,serif;font-size:26px;line-height:1.22;\">Calm, never urgent<\u002Fspan>\n        <p style=\"font-size:16px;line-height:1.6;color:var(--muted);\">A house is a decade-long decision. Nothing on this site should hurry anyone, and nothing counts down.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);\">\n      <div style=\"background:var(--paper);padding:clamp(22px,3vw,30px);display:flex;flex-direction:column;gap:20px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent2-ink);\">We say<\u002Fspan>\n        <ul style=\"display:flex;flex-direction:column;gap:15px;\">\n          <li style=\"font-size:17px;line-height:1.5;\">A house in Dénia, and what the year costs: €2,140.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.5;\">Modelo 210 is due 31 December. We filed it on the 12th.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.5;\">You will need an NIE. It takes about three weeks.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.5;\">Nothing needed from you this quarter.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:var(--paper);padding:clamp(22px,3vw,30px);display:flex;flex-direction:column;gap:20px;\">\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);\">We don't<\u002Fspan>\n        <ul style=\"display:flex;flex-direction:column;gap:15px;\">\n          <li style=\"font-size:17px;line-height:1.5;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule);\">Live the dream in sunny Spain.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.5;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule);\">Hassle-free, end-to-end, turnkey.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.5;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule);\">Prices rising fast — enquire today.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.5;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule);\">An unmissable investment opportunity.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:16px;line-height:1.6;color:var(--muted);margin-top:clamp(18px,3vw,26px);max-width:70ch;\">Dutch is the primary voice, written by a Dutch speaker rather than translated into one. English second; Spanish reserved for documents and official terms, always glossed. Prices in euros as an annual total. Dates as 14 maart 2027, never 14/03.<\u002Fp>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showApplications }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--rule);padding-top:14px;margin-bottom:clamp(26px,4vw,42px);font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;\">\n        <span style=\"color:var(--muted);\">08<\u002Fspan>\n        <h2 style=\"font-weight:700;font-size:11px;letter-spacing:0.18em;\">Applied<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,30px);border-bottom:1px solid var(--rule);flex-wrap:wrap;\">\n          <div style=\"display:flex;align-items:center;gap:10px;\">\n            <div style=\"width:18px;height:23px;border:1.25px solid var(--ink);border-radius:var(--mk-r);position:relative;flex:0 0 auto;\">\n              <span style=\"display:block;position:absolute;left:50%;transform:translateX(-50%);bottom:14%;width:1.25px;height:34%;background:var(--accent);\"><\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:Petrona,Georgia,serif;font-size:22px;line-height:1;letter-spacing:-0.025em;\">Solera<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:18px;font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap;\">\n            <span>Belasting<\u002Fspan>\n            <span>Verzekering<\u002Fspan>\n            <span>Verhuur<\u002Fspan>\n            <span>Beheer<\u002Fspan>\n            <span style=\"color:var(--paper);background:var(--ink);padding:8px 13px;\">Plan een gesprek<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:clamp(24px,4vw,48px);padding:clamp(26px,5vw,60px) clamp(16px,3vw,30px);align-items:center;\">\n          <div style=\"display:flex;flex-direction:column;gap:18px;\">\n            <span style=\"font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-ink);\">Voor Nederlandse eigenaren<\u002Fspan>\n            <h3 style=\"font-family:Petrona,Georgia,serif;font-weight:400;font-size:clamp(32px,4.6vw,56px);line-height:1.04;letter-spacing:-0.035em;\">Uw huis in Spanje, het hele jaar geregeld.<\u002Fh3>\n            <p style=\"font-size:17px;line-height:1.6;max-width:46ch;color:var(--muted);\">Belastingaangifte, verzekering, verhuurlicentie en alle post uit Spanje. Eén jaarbedrag, één aanspreekpunt, in het Nederlands.<\u002Fp>\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;\">\n              <span style=\"background:var(--ink);color:var(--paper);padding:13px 19px;\">Bekijk Solera Anual<\u002Fspan>\n              <span style=\"border:1px solid var(--ink);color:var(--ink);padding:13px 19px;\">Wat kost het jaar?<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"aspect-ratio:4/3;background-image:repeating-linear-gradient(45deg,var(--rule) 0 lean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nconst PAPERS = {\n  Plaster: { paper:\"oklch(0.966 0.014 78)\", surface:\"oklch(0.928 0.026 70)\", ink:\"oklch(0.26 0.021 45)\",  muted:\"oklch(0.510 0.022 58)\", rule:\"oklch(0.872 0.020 72)\" },\n  Sand:    { paper:\"oklch(0.952 0.022 88)\", surface:\"oklch(0.906 0.036 82)\", ink:\"oklch(0.27 0.024 60)\",  muted:\"oklch(0.505 0.026 70)\", rule:\"oklch(0.856 0.028 84)\" },\n  Cool:    { paper:\"oklch(0.968 0.008 210)\", surface:\"oklch(0.932 0.014 215)\", ink:\"oklch(0.255 0.016 240)\", muted:\"oklch(0.505 0.016 230)\", rule:\"oklch(0.876 0.012 215)\" }\n};\nconst ACCENTS = {\n  \"#B3623C\": { ink:\"#98502C\", pair:\"#6B7A3C\", pairInk:\"#5E6B34\" },\n  \"#A8503F\": { ink:\"#8E4234\", pair:\"#5E7A55\", pairInk:\"#4F6847\" },\n  \"#9A6B2E\": { ink:\"#805524\", pair:\"#4E6E62\", pairInk:\"#456158\" },\n  \"#3F6E77\": { ink:\"#33585F\", pair:\"#A8683C\", pairInk:\"#8C5430\" }\n};\n\nclass Component extends DCLogic {\n  apply() {\n    const el = document.documentElement;\n    const p = PAPERS[this.props.paperTone] || PAPERS.Plaster;\n    Object.keys(p).forEach(k => el.style.setProperty(\"--\" + k, p[k]));\n    const a = this.props.accent || \"#B3623C\";\n    el.style.setProperty(\"--accent\", a);\n    const t = ACCENTS[a] || ACCENTS[\"#B3623C\"];\n    el.style.setProperty(\"--accent-ink\", t.ink);\n    el.style.setProperty(\"--accent2\", t.pair);\n    el.style.setProperty(\"--accent2-ink\", t.pairInk);\n    const marks = { Arch:\"50% 50% 2px 2px\", Rounded:\"14px\", Square:\"2px\" };\n    el.style.setProperty(\"--mk-r\", marks[this.props.markStyle] || marks.Arch);\n  }\n  componentDidMount() { this.apply(); }\n  componentDidUpdate() { this.apply(); }\n  renderVals() {\n    return { showApplications: this.props.showApplications !== false };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
